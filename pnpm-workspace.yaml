packages:
  - apps/*
  - packages/*
allowBuilds:
  # cpu-features/protobufjs/ssh2 are testcontainers' optional native SSH-tunnel bindings; not needed
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
overrides:
  vite: "npm:@voidzero-dev/vite-plus-core@0.3.1"
  # One drizzle-orm for the whole workspace: better-auth's adapter introspects the same
  # tables our schema defines, and drizzle-kit resolves whichever copy is hoisted.
  drizzle-orm: 1.0.0-rc.4
catalog:
  dotenv: ^17.4.2
  zod: ^4.6.1
  typescript: ^7.0.2
  "@types/node": ^26.5.1
  lucide-react: ^1.43.0
  next-themes: ^0.4.6
  react: ^19.3.0
  react-dom: ^19.3.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  "@orpc/server": 2.0.0-beta.35
  "@orpc/client": 2.0.0-beta.35
  "@orpc/openapi": 2.0.0-beta.35
  "@orpc/zod": 2.0.0-beta.35
  better-auth: 1.7.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
minimumReleaseAgeExclude:
  - "@orpc/client@2.0.0-beta.35"
