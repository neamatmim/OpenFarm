# The farm's server writes its log to the journal (deploy/openfarm.service), and the journal is what the Owner reads
# when the app says the server is failing. Left to its defaults, journald keeps up to a tenth of the disk and, on a
# small server, may keep a week — or it may keep a year and fill the disk the database lives on. These are the limits:
# three months of log, two gigabytes at most, whichever comes first.
#
# Installed by docs/runbooks/deploy.md as /etc/systemd/journald.conf.d/openfarm.conf, then
# `sudo systemctl restart systemd-journald`.
[Journal]
Storage=persistent
SystemMaxUse=2G
MaxRetentionSec=90day
